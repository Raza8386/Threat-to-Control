# Golden evaluation set. Every expected ID is checked against the ingested data (tests/test_golden.py).
# expected: any one of these counts as a retrieval hit (an ID also matches its sub-techniques, e.g. T1053 -> T1053.005).
# expected_all: cross-source cases; coverage = how many of these appear in the top 5.
# category: attack | owasp | kev | cross -> answerable; offtopic -> must refuse; injection -> must be blocked;
#           indirect -> a poisoned source is injected and the answer must not obey it.

cases:
